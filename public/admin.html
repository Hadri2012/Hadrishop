<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administration — HADRISHOP</title>
<style>
/* VOICE: outil de gestion sobre et dense, comme le carnet de bord de l'atelier.
   IDEA: tableau de bord d'atelier — chiffres d'abord, actions ensuite.
   PICTURE: le graphique des ventes nettes par jour.
   COLOUR and TYPE: blanc, encre, bleu cobalt pour l'action, orange pour ce qui demande attention ; Archivo.
   LAYOUT: barre latérale de navigation, contenu en colonnes qui s'empilent sur mobile. */
/*@FONTS@*/
:root{color-scheme:light dark;--bg:light-dark(#f4f5f8,#0b0d12);--card:light-dark(#fff,#141821);--ink:light-dark(#14161a,#eef0f6);--muted:light-dark(#5b6070,#a3a9ba);
 --line:light-dark(#e3e6ee,#262a36);--soft:light-dark(#f2f4f8,#1a1f2b);--blue:light-dark(#2340e6,#6b82ff);--orange:light-dark(#e2480f,#ff7a45);--ok:light-dark(#0f7a44,#4fd18b);--err:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
h1{font-size:28px;margin:0 0 14px;line-height:1.1}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:var(--ink);color:var(--bg);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside .brand{font-weight:800;font-size:19px;padding:6px 10px 16px}
aside a{display:flex;justify-content:space-between;color:inherit;text-decoration:none;padding:9px 10px;border-radius:8px;font-weight:600;opacity:.85}
aside a[aria-current=page]{background:rgba(127,127,127,.25);opacity:1}
aside .cnt{background:var(--orange);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
main{padding:22px clamp(14px,3vw,34px)}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}aside .brand{width:100%;padding-bottom:6px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{color:var(--muted);font-size:13px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.scroll{overflow-x:auto}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:9px;min-height:40px;padding:8px 14px;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.danger{background:var(--err);color:#fff}
.sm{min-height:32px;padding:4px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:40px}
textarea{min-height:100px;resize:vertical}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
label.check{display:flex;gap:8px;align-items:center;font-weight:500}
label.check input{width:18px;min-height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 150px}
.row>.auto{flex:0 0 auto}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12.5px;font-weight:700;background:var(--soft);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--orange)}.pill.err{color:var(--err)}
.muted{color:var(--muted)}.small{font-size:13px}
.notice{border-left:4px solid var(--blue);background:var(--soft);padding:10px 12px;border-radius:8px;margin:10px 0}
.notice.err{border-color:var(--err)}
.fig{position:relative;height:260px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumbs figure{margin:0;width:110px}.thumbs img{width:110px;height:110px;object-fit:cover;border-radius:8px;background:var(--soft)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;z-index:50;max-width:420px}
.toast.err{background:var(--err);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal>div{background:var(--card);border-radius:12px;padding:20px;max-width:440px;width:100%}
.login{max-width:380px;margin:12vh auto}
.vtable input{min-height:34px;padding:4px 6px}
</style>
</head>
<body>
<div id="root"><p style="padding:30px">Chargement…</p></div>
<script>
{
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (c) => new Intl.NumberFormat('fr-BE', { style: 'currency', currency: 'EUR' }).format((c || 0) / 100);
const fdt = (ts) => ts ? new Date(ts * 1000).toLocaleString('fr-BE', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const fd = (ts) => ts ? new Date(ts * 1000).toLocaleDateString('fr-BE') : '—';
const cents = (v) => { const n = Math.round(parseFloat(String(v).replace(/\s/g, '').replace(',', '.')) * 100); return Number.isFinite(n) ? n : null; };
const euroIn = (c) => c == null ? '' : (c / 100).toFixed(2).replace('.', ',');
const dateIn = (ts) => ts ? new Date(ts * 1000).toISOString().slice(0, 10) : '';
const tsFrom = (d, end) => d ? Math.floor(new Date(d + (end ? 'T23:59:59' : 'T00:00:00')).getTime() / 1000) : null;
const root = $('#root');
let me = null, view = 'dashboard', counts = {};

function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 4500); }
function ask(message, ok = 'Confirmer', danger) {
  return new Promise((res) => { const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div role="dialog" aria-modal="true"><p>${esc(message)}</p><div class="row" style="justify-content:flex-end"><button class="ghost auto" data-v="0">Annuler</button><button class="auto ${danger ? 'danger' : ''}" data-v="1">${esc(ok)}</button></div></div>`;
    m.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b || e.target === m) { m.remove(); res(!!b && b.dataset.v === '1'); } }); document.body.appendChild(m); });
}
async function api(path, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const r = await fetch('/api' + path, { method: opts.method || 'GET', credentials: 'same-origin', headers: { 'X-Hadrishop': '1', ...(opts.body && !isForm ? { 'Content-Type': 'application/json' } : {}) }, body: isForm ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Erreur ' + r.status); e.status = r.status; throw e; }
  return d;
}
const run = async (fn, okMsg) => { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); if (e.status === 401) boot(); return undefined; } };
const STATUS = { pending_payment: 'En attente de paiement', payment_processing: 'Paiement en cours', payment_failed: 'Paiement échoué', expired: 'Expirée', cancelled: 'Annulée', paid: 'Payée', in_production: 'En impression', shipped: 'Expédiée', ready_for_pickup: 'Prête à retirer', delivered: 'Livrée', completed: 'Terminée' };
const PAY = { unpaid: ['Non payée', ''], paid: ['Payée', 'ok'], partially_refunded: ['Remb. partiel', 'warn'], refunded: ['Remboursée', 'err'] };
const pill = (t, c = '') => `<span class="pill ${c}">${esc(t)}</span>`;

const NAV = [['dashboard', 'Tableau de bord'], ['orders', 'Commandes', 'orders'], ['products', 'Produits'], ['categories', 'Catégories'], ['promos', 'Codes promo'], ['shipping', 'Livraison'],
  ['custom', 'Sur mesure', 'custom_requests'], ['refunds', 'Remboursements', 'refund_requests'], ['customers', 'Clients'], ['newsletter', 'Newsletter'], ['emails', 'E-mails', 'failed_emails'], ['settings', 'Paramètres'], ['audit', 'Journal']];

function shell() {
  root.innerHTML = `<div class="shell"><aside><div class="brand">HADRISHOP · admin</div>
    ${NAV.map(([k, l, c]) => `<a href="#${k}" ${view === k ? 'aria-current="page"' : ''}>${l}${c && counts[c] ? `<span class="cnt">${counts[c]}</span>` : ''}</a>`).join('')}
    <a href="/" style="margin-top:14px">← Boutique</a><a href="#" id="logout">Déconnexion</a></aside><main id="main"><p class="muted">Chargement…</p></main></div>`;
  $('#logout').addEventListener('click', async (e) => { e.preventDefault(); await api('/auth/logout', { method: 'POST' }).catch(() => {}); boot(); });
}
async function route() {
  view = (location.hash.slice(1).split('-')[0]) || 'dashboard';
  if (!VIEWS[view]) view = 'dashboard';
  shell();
  const main = $('#main');
  try { await VIEWS[view](main, location.hash.slice(1).split('-').slice(1).join('-')); } catch (e) { main.innerHTML = `<div class="notice err">${esc(e.message)}</div>`; if (e.status === 401 || e.status === 403) boot(); }
}

// ---------- Tableau de bord ----------
let days = 30;
async function vDashboard(main) {
  const s = await api('/admin/stats?days=' + days);
  counts = s.to_process;
  const t = s.totals;
  main.innerHTML = `<div class="row" style="justify-content:space-between;align-items:center"><h1 class="auto" style="margin:0">Ventes nettes : ${eur(t.net_cents)} sur ${days} jours</h1>
    <select id="days" class="auto" style="width:auto" aria-label="Période">${[7, 30, 90, 365].map((d) => `<option value="${d}" ${d === days ? 'selected' : ''}>${d} jours</option>`).join('')}</select></div>
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><span>Encaissé</span><b>${eur(t.gross_cents)}</b></div><div class="kpi"><span>Remboursé</span><b>${eur(t.refunds_cents)}</b></div>
      <div class="kpi"><span>Commandes payées</span><b>${t.orders}</b></div><div class="kpi"><span>Panier moyen</span><b>${eur(t.average_order_cents)}</b></div>
      <div class="kpi"><span>Membres Premium</span><b>${s.premium_members}</b><span>≈ ${eur(s.premium_mrr_estimate_cents)}/mois (estimation)</span></div>
      <div class="kpi"><span>Clients · nouveaux (période)</span><b>${s.customers} · ${s.new_customers}</b></div>
      <div class="kpi"><span>Abonnés newsletter</span><b>${s.newsletter_confirmed}</b></div><div class="kpi"><span>CA net depuis l'ouverture</span><b>${eur(s.all_time_net_cents)}</b></div></div>
    <div class="card"><h2>Ventes nettes par jour</h2><div class="fig" id="chart"><svg></svg></div><p class="small muted">Encaissements Stripe confirmés moins remboursements réussis, par jour (heure de Bruxelles).</p></div>
    <div class="cols"><div class="card"><h2>À traiter</h2><table><tbody>
      <tr><td><a href="#orders">Commandes à préparer</a></td><td class="num">${counts.orders}</td></tr><tr><td><a href="#custom">Demandes sur mesure sans devis</a></td><td class="num">${counts.custom_requests}</td></tr>
      <tr><td><a href="#refunds">Demandes de remboursement</a></td><td class="num">${counts.refund_requests}</td></tr><tr><td><a href="#emails">E-mails en échec</a></td><td class="num">${counts.failed_emails}</td></tr>
      <tr><td><a href="#audit">Webhooks Stripe en échec</a></td><td class="num">${counts.failed_webhooks}</td></tr></tbody></table></div>
    <div class="card"><h2>Meilleures ventes</h2>${s.top_products.length ? `<table><thead><tr><th>Produit</th><th class="num">Qté</th><th class="num">CA</th></tr></thead><tbody>${s.top_products.map((p) => `<tr><td>${esc(p.name)}</td><td class="num">${p.qty}</td><td class="num">${eur(p.revenue_cents)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucune vente sur la période.</p>'}</div>
    <div class="card"><h2>Stock bas</h2>${s.low_stock.length ? `<table><tbody>${s.low_stock.map((v) => `<tr><td><a href="#products-${v.product_id}">${esc(v.product)}</a> <span class="muted small">${esc(v.name)} · ${esc(v.sku)}</span></td><td class="num">${pill(v.stock, v.stock === 0 ? 'err' : 'warn')}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucune variante sous le seuil.</p>'}</div></div>`;
  $('#days').addEventListener('change', (e) => { days = Number(e.target.value); route(); });
  const svg = $('#chart svg');
  const draw = () => {
    const W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
    const d = s.daily, max = Math.max(1, ...d.map((x) => Math.max(x.net_cents, 0)));
    const pad = { l: 56, r: 8, t: 10, b: 24 }, bw = (W - pad.l - pad.r) / d.length;
    const y = (v) => pad.t + (H - pad.t - pad.b) * (1 - Math.max(v, 0) / max);
    const ticks = [0, 0.5, 1].map((f) => Math.round(max * f));
    svg.innerHTML = ticks.map((v) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(eur(v).replace(/,00/, ''))}</text>`).join('')
      + d.map((x, i) => `<rect x="${pad.l + i * bw + bw * 0.15}" y="${y(x.net_cents)}" width="${Math.max(1, bw * 0.7)}" height="${Math.max(0, H - pad.b - y(x.net_cents))}" rx="2" fill="var(--blue)"><title>${esc(x.date)} : ${esc(eur(x.net_cents))} (${x.orders} cmd)</title></rect>`).join('')
      + (W > 520 ? d.filter((_, i) => i % Math.ceil(d.length / 8) === 0).map((x) => { const i = d.indexOf(x); return `<text x="${pad.l + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(x.date.slice(5).split('-').reverse().join('/'))}</text>`; }).join('') : '');
  };
  draw(); new ResizeObserver(draw).observe($('#chart'));
}

// ---------- Commandes ----------
let oFilter = { status: 'to_process', q: '' };
async function vOrders(main, id) {
  if (id) return orderDetail(main, Number(id));
  const list = await api('/admin/orders?' + new URLSearchParams(Object.entries(oFilter).filter(([, v]) => v)));
  main.innerHTML = `<h1>Commandes</h1><div class="row"><select id="of-s"><option value="">Toutes</option><option value="to_process">À traiter</option>${Object.entries(STATUS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
    <input id="of-q" placeholder="N°, e-mail ou nom" value="${esc(oFilter.q)}"><button class="auto" id="of-go">Filtrer</button></div>
    <div class="card scroll" style="margin-top:12px">${list.length ? `<table><thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Statut</th><th>Paiement</th><th>Livraison</th><th class="num">Total</th></tr></thead><tbody>
    ${list.map((o) => `<tr class="click" data-id="${o.id}"><td><a href="#orders-${o.id}">${esc(o.number)}</a></td><td>${esc(o.customer)}<br><span class="small muted">${esc(o.email)}</span></td><td>${fdt(o.created_at)}</td><td>${pill(o.status_label)}</td><td>${pill(...PAY[o.payment_status])}</td><td class="small">${esc(o.shipping_method || '—')}</td><td class="num">${eur(o.total_cents)}${o.refunded_cents ? `<br><span class="small muted">−${eur(o.refunded_cents)}</span>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Aucune commande.</p>'}</div>`;
  $('#of-s').value = oFilter.status;
  const go = () => { oFilter = { status: $('#of-s').value, q: $('#of-q').value.trim() }; route(); };
  $('#of-go').addEventListener('click', go); $('#of-s').addEventListener('change', go); $('#of-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  main.querySelectorAll('tr[data-id]').forEach((tr) => tr.addEventListener('click', (e) => { if (!e.target.closest('a')) location.hash = 'orders-' + tr.dataset.id; }));
}
async function orderDetail(main, id) {
  const o = await api('/admin/orders/' + id);
  const paid = o.payment_status !== 'unpaid';
  main.innerHTML = `<p><a href="#orders">← Commandes</a></p><h1>${esc(o.number)} ${pill(o.status_label)} ${pill(...PAY[o.payment_status])}</h1>
  <div class="cols"><div>
    <div class="card"><h2>Articles</h2><table><thead><tr><th>Article</th><th class="num">PU</th><th class="num">Qté</th><th class="num">Total</th></tr></thead><tbody>
      ${o.items.map((i) => `<tr><td>${esc(i.product_name)}<br><span class="small muted">${esc(i.variant_name || '')} ${i.sku ? '· ' + esc(i.sku) : ''} · ${esc(i.type)}</span></td><td class="num">${eur(i.unit_price_cents)}</td><td class="num">${i.qty}</td><td class="num">${eur(i.line_total_cents)}</td></tr>`).join('')}</tbody></table>
      <table style="margin-top:8px"><tbody><tr><td>Sous-total</td><td class="num">${eur(o.subtotal_cents)}</td></tr>${o.premium_discount_cents ? `<tr><td>Remise Premium</td><td class="num">−${eur(o.premium_discount_cents)}</td></tr>` : ''}${o.discount_cents ? `<tr><td>Code ${esc(o.promo_code)}</td><td class="num">−${eur(o.discount_cents)}</td></tr>` : ''}
      <tr><td>Livraison (${esc(o.shipping_method || '—')})</td><td class="num">${eur(o.shipping_cents)}</td></tr><tr><th>Total</th><th class="num">${eur(o.total_cents)}</th></tr><tr><td>Remboursé</td><td class="num">${eur(o.refunded_cents)}</td></tr></tbody></table>
      <p class="small muted">Client : <a href="#customers-${o.user_id}">${esc(o.customer)}</a> · ${esc(o.email)} · Stripe : ${esc(o.stripe_payment_intent || 'non payé')}</p>
      ${o.customer_note ? `<div class="notice"><b>Note du client :</b> ${esc(o.customer_note)}</div>` : ''}</div>
    <div class="card"><h2>Historique</h2><table><tbody>${o.events.map((e) => `<tr><td class="small">${fdt(e.created_at)}</td><td>${esc(e.message || e.type)} <span class="small muted">${esc(e.actor || '')}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>Note interne</h2><textarea id="o-note">${esc(o.admin_note || '')}</textarea><p><button id="o-note-save" class="ghost">Enregistrer la note</button></p></div>
  </div><div>
    ${paid ? `<div class="card"><h2>Statut et suivi</h2><label for="o-st">Statut</label><select id="o-st">${o.statuses.map((s) => `<option value="${s.value}" ${s.value === o.status ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}</select>
      <div class="row"><div><label for="o-car">Transporteur</label><input id="o-car" value="${esc(o.tracking_carrier || '')}"></div><div><label for="o-num">N° de suivi</label><input id="o-num" value="${esc(o.tracking_number || '')}"></div></div>
      <label for="o-url">Lien de suivi (https://)</label><input id="o-url" value="${esc(o.tracking_url || '')}"><label for="o-msg">Message au client (facultatif)</label><input id="o-msg">
      <p class="small muted">Le client reçoit un e-mail à chaque changement.</p><button id="o-st-save">Mettre à jour</button></div>` : '<div class="notice">Commande non payée : aucune action de préparation possible.</div>'}
    ${o.needs_shipping ? `<div class="card"><h2>Adresse de livraison</h2>${o.ship_line1 ? `<p>${esc(o.ship_name)}<br>${esc(o.ship_line1)}${o.ship_line2 ? '<br>' + esc(o.ship_line2) : ''}<br>${esc(o.ship_postal)} ${esc(o.ship_city)} ${esc(o.ship_country || '')}${o.ship_phone ? '<br>' + esc(o.ship_phone) : ''}</p>` : '<p class="muted">Retrait sur place.</p>'}
      <details><summary>Modifier l'adresse</summary><div class="row"><div><label>Nom</label><input id="a-name" value="${esc(o.ship_name || '')}"></div><div><label>Téléphone</label><input id="a-phone" value="${esc(o.ship_phone || '')}"></div></div>
      <label>Rue et numéro</label><input id="a-line1" value="${esc(o.ship_line1 || '')}"><label>Complément</label><input id="a-line2" value="${esc(o.ship_line2 || '')}">
      <div class="row"><div><label>Code postal</label><input id="a-postal" value="${esc(o.ship_postal || '')}"></div><div><label>Localité</label><input id="a-city" value="${esc(o.ship_city || '')}"></div></div><p><button id="a-save" class="ghost">Enregistrer l'adresse</button></p></details></div>` : ''}
    ${paid ? `<div class="card"><h2>Rembourser</h2><p class="small">Remboursable : <b>${eur(o.refundable_cents)}</b> (via Stripe, vers le moyen de paiement d'origine).</p>

  </div></div>`;

  const st = $('#o-st-save');

  const rg = $('#r-go');
  if (rg) rg.addEventListener('click', async () => {
    const amount = cents($('#r-amt').value); if (!amount || amount <= 0) return toast('Montant invalide', true);

  });
}

     <label>Couleurs (séparées par des virgules)</label><input id="s-colors" value="${esc(s.colors.join(', '))}"><label>Seuil d'alerte de stock bas</label><input id="s-low_stock_threshold" inputmode="numeric" value="${s.low_stock_threshold}">
     <label>Téléchargements autorisés par fichier STL acheté</label><input id="s-download_max_count" inputmode="numeric" value="${s.download_max_count}">
     <label class="check"><input type="checkbox" id="s-require_email_verification" ${s.require_email_verification ? 'checked' : ''}> Exiger une adresse e-mail confirmée pour commander</label></div>
   <div class="card"><h2>Premium</h2><label class="check"><input type="checkbox" id="s-premium_enabled" ${s.premium_enabled ? 'checked' : ''}> Programme Premium ouvert aux nouveaux abonnés</label>
     <div class="row"><div><label>Prix (€)</label><input id="s-premium_price" inputmode="decimal" value="${euroIn(s.premium_price_cents)}"></div><div><label>Période</label><select id="s-premium_interval"><option value="month">Mensuel</option><option value="year" ${s.premium_interval === 'year' ? 'selected' : ''}>Annuel</option></select></div></div>
     <label>Remise Premium (%)</label><input id="s-premium_discount_percent" inputmode="numeric" value="${s.premium_discount_percent}"><label class="check"><input type="checkbox" id="s-premium_free_shipping" ${s.premium_free_shipping ? 'checked' : ''}> Livraison offerte aux membres</label>
     <p class="small muted">Un changement de prix s’applique aux nouveaux abonnements ; les abonnements existants gardent leur prix dans Stripe.</p>
     <h2 style="margin-top:16px">Conditions générales de vente</h2><textarea id="s-terms_text" style="min-height:220px">${esc(s.terms_text)}</textarea></div></div>
   <p><button id="s-save">Enregistrer les paramètres</button></p>`;
  $('#s-save').addEventListener('click', () => {
    const v = (k) => $('#s-' + k).value; const c = (k) => $('#s-' + k).checked; const list = (k) => v(k).split(',').map((x) => x.trim()).filter(Boolean);
    run(() => api('/admin/settings', { method: 'PUT', body: { shop_name: v('shop_name'), shop_tagline: v('shop_tagline'), contact_email: v('contact_email'), shop_address: v('shop_address'), max_print_dimensions_mm: v('max_print_dimensions_mm'),
      materials: list('materials'), colors: list('colors'), low_stock_threshold: Number(v('low_stock_threshold')), download_max_count: Number(v('download_max_count')), require_email_verification: c('require_email_verification'),
      premium_enabled: c('premium_enabled'), premium_price_cents: cents(v('premium_price')), premium_interval: v('premium_interval'), premium_discount_percent: Number(v('premium_discount_percent')), premium_free_shipping: c('premium_free_shipping'), terms_text: v('terms_text') } }), 'Paramètres enregistrés');
  });
}

// ---------- Journal ----------
async function vAudit(main) {
  const [a, ev] = await Promise.all([api('/admin/audit'), api('/admin/stripe-events')]);
  main.innerHTML = `<h1>Journal</h1><div class="cols"><div class="card scroll"><h2>Actions des administrateurs</h2><table><tbody>${a.map((x) => `<tr><td class="small">${fdt(x.created_at)}</td><td>${esc(x.action)}<br><span class="small muted">${esc(x.email || '')} ${esc(x.ip || '')}</span></td><td class="small muted">${esc(x.details || '')}</td></tr>`).join('')}</tbody></table></div>
   <div class="card scroll"><h2>Événements Stripe reçus</h2><table><tbody>${ev.map((x) => `<tr><td class="small">${fdt(x.received_at)}</td><td>${esc(x.type)}<br><span class="small muted">${esc(x.id)}</span></td><td>${pill(x.status, x.status === 'processed' ? 'ok' : x.status === 'failed' ? 'err' : 'warn')}${x.error ? `<br><span class="small muted">${esc(x.error)}</span>` : ''}</td></tr>`).join('') || '<tr><td class="muted">Aucun événement.</td></tr>'}</tbody></table></div></div>`;
}

const VIEWS = { dashboard: vDashboard, orders: vOrders, products: vProducts, categories: vCategories, promos: vPromos, shipping: vShipping, custom: vCustom, refunds: vRefunds, customers: vCustomers, newsletter: vNewsletter, emails: vEmails, settings: vSettings, audit: vAudit };

function loginForm(msg) {
  root.innerHTML = `<form class="card login" id="lf"><h1>Administration</h1>${msg ? `<div class="notice err">${esc(msg)}</div>` : ''}<label for="lf-e">E-mail</label><input id="lf-e" type="email" required autocomplete="username"><label for="lf-p">Mot de passe</label><input id="lf-p" type="password" required autocomplete="current-password"><p><button>Se connecter</button></p><p class="small"><a href="/">← Retour à la boutique</a></p></form>`;
  $('#lf').addEventListener('submit', async (e) => { e.preventDefault(); try { const r = await api('/auth/login', { method: 'POST', body: { email: $('#lf-e').value, password: $('#lf-p').value } }); if (r.user.role !== 'admin') { await api('/auth/logout', { method: 'POST' }); return loginForm('Ce compte n’a pas les droits d’administration.'); } boot(); } catch (err) { loginForm(err.message); } });
}
async function boot() {
  try { me = await api('/me'); } catch { me = null; }
  if (!me || me.role !== 'admin') return loginForm(me ? 'Ce compte n’a pas les droits d’administration.' : '');
  try { counts = (await api('/admin/stats?days=7')).to_process; } catch { counts = {}; }
  route();
}
window.addEventListener('hashchange', () => { if (me && me.role === 'admin') route(); });
boot();
}
</script>
</body>
</html>
