# Déploiement sur un serveur (VPS) : HADRISHOP + Caddy (HTTPS automatique via Let's Encrypt/ZeroSSL)
services:
  hadrishop:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - hadrishop-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hadrishop
volumes:
  hadrishop-data:
  caddy-data:
  caddy-config:
